<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>🧀 Cheese Slicer</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="description" content="Free online cheese slicer" />
  </head>

  <body>
    <div id="app">
      <div class="cheese-wrapper" aria-live="polite">
        <div id="cheese" role="img" aria-label="Block of yellow cheese">
          <div class="cheese-fill" aria-hidden="true"></div>
        </div>
        <img id="slicer" src="slicer.svg" decoding="async" />
      </div>
      <div id="message" class="hidden" role="status">
        <span class="end-text">All cheese sliced.</span>
        <button
          id="restart"
          type="button"
          class="restart-btn"
          aria-label="Restart slicing"
        >
          Restart
        </button>
      </div>
    </div>
    <footer id="footer" aria-label="Footer note">
      Made with 🧀 in 🇳🇱 &middot;
      <a href="https://github.com/crnh/kaas">source</a>
    </footer>
    <noscript
      >This page requires JavaScript for the slicing interaction.</noscript
    >
    <script src="script.js"></script>
  </body>
</html>
